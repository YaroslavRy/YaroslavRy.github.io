</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a class="brand" href="../../index.html">yaroslav<span class="dot">.</span>lab</a>
    <ul>
      <li><a href="../../index.html">Specimens</a></li>

</nav>

<div class="project-head">
  <div class="wrap">
    <a class="back" href="../../index.html">← back to specimens</a>
    <h1>Glyph Animation</h1>
    <div class="project-meta">
      <span>Canvas 2D + jQuery</span>
      <span>Original site's homepage, restored</span>
    </div>
  </div>
</div>

<section style="padding-top:var(--space-3);">
  <div class="wrap project-layout">
    <div class="project-main">
    <div class="project-stage">
      <canvas id="canvas"></canvas>
      <div class="project-controls">
        <label>
          Glyph size
          <input id="cells_slider" type="range" min="6" max="30" step="1" value="11">
        </label>
        <label>
          Label overlay
          <input id="label_toggle" type="checkbox" checked>
        </label>
      </div>
    </div>
    </div>
    <aside class="project-description">
    <p class="project-notes">Random glyphs with fading trails. Adjust glyph spacing or toggle the title overlay.</p>
    </aside>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap" style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:0.5rem; width:100%;">
    <span>© 2026</span>
    <a href="../../index.html">← back to specimens</a>
  </div>
</footer>

<script src="cellular.js"></script>
<script>
  $(document).ready(function () {
    $('#cells_slider').on('input', function () {
      window.cellStep = parseInt($(this).val());
    });
    $('#label_toggle').on('change', function () {
      window.showLabel = $(this).is(':checked');
    });
  });
</script>
</body>
</html>
